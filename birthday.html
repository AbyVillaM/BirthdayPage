<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <head>
        <link rel="icon" type="image/png" href="pastel.png">
        
        <title>¡FELICIDADES!</title>
    </head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gift-wrapper" onclick="openGift()" >

    <div class="open-label">
        Ábreme
    </div>

    <div class="gift-scene">

        <div id="gift-cube">

            <div class="gift-face front">
                <div class="ribbon-vertical"></div>
                <div class="ribbon-horizontal"></div>
            </div>

            <div class="gift-face right">
                <div class="ribbon-horizontal"></div>
                <div class="ribbon-vertical"></div>
            </div>

            <div class="gift-face back">
                <div class="ribbon-vertical"></div>
                <div class="ribbon-horizontal"></div>
            </div>

            <div class="gift-face left">
                <div class="ribbon-horizontal"></div>
                <div class="ribbon-vertical"></div>
            </div>

            <div class="gift-face top">
                <div class="ribbon-vertical"></div>
                <div class="ribbon-horizontal"></div>
            </div>

            <div class="gift-face bottom"></div>

             <div class="gift-bow">
                <div class="bow-loop bow-left"></div>
                <div class="bow-loop bow-right"></div>
                <div class="bow-center"></div>
            </div>

        </div>

    </div>

    <div class="click-hint"></div>

</div>


<div id="greeting-card">
    <div class="neon-subtitle">
        For the love of my life!
    </div>

    <div class="cake">
        <div class="cake-top"></div>
        <div class="cake-body"></div>
        <div class="cake-candle"></div>
        <div class="cake-flame"></div>
    </div>

    <div class="neon-title">
        Happy
    </div>

    <div class="neon-age">
        17
    </div>

    <div class="neon-footer">
        Birthday!
    </div>

    <div class="card-message">
        Que este día esté lleno de momentos
        increíbles, sonrisas y muchísimo amor.
    </div>

    <div class="card-metadata">
        <div>
            Para: <span></span>
        </div>

        <div>
            Fecha: <span></span>
        </div>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
