<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/fontcard.png">
    <title>¡FELICIDADES!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <audio id="bg-music" loop>
        <source src="assets/music/cumpleaños.mp3" type="audio/mpeg">
    </audio>

    <div id="reloj-screen">
        <div class="reloj-content">
            <div class="reloj-fecha">
                <span id="reloj-dia">03</span>
                <span class="reloj-sep">de</span>
                <span id="reloj-mes">septiembre</span>
                <span class="reloj-sep">de</span>
                <span id="reloj-anio">2026</span>
            </div>
            <div class="reloj-hora" id="reloj-hora">
                <span id="reloj-horas">23</span>
                <span class="reloj-dos-puntos">:</span>
                <span id="reloj-minutos">59</span>
                <span class="reloj-dos-puntos">:</span>
                <span id="reloj-segundos">57</span>
            </div>
        </div>
    </div>

    <div id="gift-wrapper" onclick="openGift()">
        <div class="open-label">¡Ábreme!</div>
        <div class="gift-scene">
            <div id="gift-cube">
                <div class="gift-face front">
                    <div class="ribbon-vertical"></div>
                    <div class="ribbon-horizontal"></div>
                </div>
                <div class="gift-face right">
                    <div class="ribbon-horizontal"></div>
                    <div class="ribbon-vertical"></div>
                </div>
                <div class="gift-face back">
                    <div class="ribbon-vertical"></div>
                    <div class="ribbon-horizontal"></div>
                </div>
                <div class="gift-face left">
                    <div class="ribbon-horizontal"></div>
                    <div class="ribbon-vertical"></div>
                </div>
                <div class="gift-face top">
                    <div class="ribbon-vertical"></div>
                    <div class="ribbon-horizontal"></div>
                </div>
                <div class="gift-face bottom"></div>
                <div class="gift-bow">
                    <div class="bow-loop bow-left"></div>
                    <div class="bow-loop bow-right"></div>
                    <div class="bow-center"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="greeting-card">
        <div class="neon-title">¡Ay no ya casi eres adulto!</div>
        <div class="monito-space">
            <img src="assets/images/cry.png" alt="Monito de fiesta" />
        </div>
        <div class="neon-footer">¡Felices</div>
        <div class="neon-age">17</div>
        <div class="neon-footer">Vueltas al sol!</div>
        <div class="letter-container">
            <div class="letter-glow"></div>
            <div class="envelope" id="envelope" onclick="abrirSobre()">
                <div class="envelope-back"></div>
                <div class="envelope-paper">
                </div>
                <div class="envelope-flap"></div>
                <div class="envelope-front"></div>
                <div class="envelope-seal"></div>
            </div>
            <div class="envelope-label">¡Ábre el Sobre!</div>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <script src="script.js"></script>
</body>

</html>
